<title>Pipeline Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #eef1f6;
    --ink-2: #ffffff;
    --ink-3: #f5f7fa;
    --hairline: #d3d9e3;
    --text: #1c2130;
    --text-dim: #55607a;
    --text-faint: #838da3;
    --accent: #b96f2c;
    --accent-soft: rgba(185, 111, 44, 0.12);
    --done: #1f8a54;
    --done-soft: rgba(31, 138, 84, 0.12);
    --blocked: #c53e3e;
    --blocked-soft: rgba(197, 62, 62, 0.12);
    --pending: #9aa1b5;
    --pending-soft: rgba(154, 161, 181, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #12131c;
      --ink-2: #191b28;
      --ink-3: #14151f;
      --hairline: #2b2e42;
      --text: #e9e6dd;
      --text-dim: #8d90a8;
      --text-faint: #565973;
      --accent: #d98a3d;
      --accent-soft: rgba(217, 138, 61, 0.16);
      --done: #6fcf97;
      --done-soft: rgba(111, 207, 151, 0.14);
      --blocked: #eb5757;
      --blocked-soft: rgba(235, 87, 87, 0.14);
      --pending: #454863;
      --pending-soft: rgba(69, 72, 99, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --ink: #12131c;
    --ink-2: #191b28;
    --ink-3: #14151f;
    --hairline: #2b2e42;
    --text: #e9e6dd;
    --text-dim: #8d90a8;
    --text-faint: #565973;
    --accent: #d98a3d;
    --accent-soft: rgba(217, 138, 61, 0.16);
    --done: #6fcf97;
    --done-soft: rgba(111, 207, 151, 0.14);
    --blocked: #eb5757;
    --blocked-soft: rgba(235, 87, 87, 0.14);
    --pending: #454863;
    --pending-soft: rgba(69, 72, 99, 0.2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 16px 16px 32px;
  }

  .wrap {
    max-width: none;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 12px;
  }

  .title-block { display: flex; flex-direction: column; gap: 4px; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: clamp(18px, 3vw, 24px);
    letter-spacing: -0.01em;
  }

  .header-actions { display: flex; align-items: center; gap: 10px; }

  .view-toggle {
    display: flex;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    overflow: hidden;
  }

  .view-toggle button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 12px;
    background: var(--ink-2);
    color: var(--text-dim);
    border: none;
    cursor: pointer;
  }

  .view-toggle button + button { border-left: 1px solid var(--hairline); }
  .view-toggle button.active { background: var(--accent-soft); color: var(--accent); }
  .view-toggle button:hover:not(.active) { color: var(--text); }

  .theme-toggle {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    background: var(--ink-2);
    color: var(--text-dim);
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 16px; height: 16px; }

  .layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }

  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- left: session panel ---------- */
  .session-panel {
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--ink-2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .session-panel-head {
    padding: 10px 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .session-count {
    font-family: "IBM Plex Mono", monospace;
    color: var(--text-dim);
    background: var(--ink-3);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10.5px;
  }

  .session-list { display: flex; flex-direction: column; max-height: 640px; overflow-y: auto; }

  .session-empty {
    padding: 22px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--text-faint);
    text-align: center;
  }

  .session-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
    padding: 10px 12px;
    border: none;
    border-bottom: 1px solid var(--hairline);
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
  }
  .session-row:last-child { border-bottom: none; }
  .session-row:hover { background: var(--ink-3); }
  .session-row.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }

  .session-top { display: flex; align-items: center; gap: 7px; min-width: 0; }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .dot-pending { background: var(--pending); }
  .dot-running { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot-done { background: var(--done); }
  .dot-blocked { background: var(--blocked); box-shadow: 0 0 0 3px var(--blocked-soft); }
  .dot-skipped { background: var(--text-faint); }

  .session-name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    padding-left: 14px;
  }
  .session-meta b { color: var(--text-dim); font-weight: 500; }

  .session-progress { display: flex; gap: 2px; padding-left: 14px; }
  .session-progress span { flex: 1; height: 3px; border-radius: 2px; background: var(--pending); }

  /* ---------- right: main pane ---------- */
  .main-pane { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .info-box {
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--ink-2);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .info-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

  .info-name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .info-feature {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.4;
    margin: 0;
    flex: 1;
    min-width: 200px;
  }

  .info-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    display: flex;
    flex-wrap: wrap;
    gap: 5px 18px;
    font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--hairline);
    padding-top: 8px;
  }
  .info-meta b { color: var(--text); font-weight: 500; }
  .info-meta .stage-now b { color: var(--accent); }

  .empty-state {
    border: 1px dashed var(--hairline);
    border-radius: 8px;
    padding: 40px 16px;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-faint);
  }

  /* ---------- flow diagram ---------- */
  .flow-panel {
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--ink-2);
    padding: 24px 16px 30px;
    display: flex;
    justify-content: center;
  }

  .flow-svg { display: block; width: 100%; max-width: 620px; height: auto; }

  .flow-node rect {
    stroke: var(--hairline);
    stroke-width: 1.5;
    fill: var(--ink-3);
  }
  .flow-node text {
    font-family: "IBM Plex Mono", monospace;
    fill: var(--text);
  }
  .flow-node .flow-code { fill: var(--text-faint); font-size: 12px; letter-spacing: 0.05em; }
  .flow-node .flow-label { font-size: 18px; font-weight: 600; }
  .flow-node .flow-agent { fill: var(--text-dim); font-size: 13px; letter-spacing: 0.01em; }
  .flow-node .flow-status-dot { }

  .flow-edge {
    stroke: var(--hairline);
    stroke-width: 2;
    fill: none;
  }

  .flow-edge.edge-done { stroke: var(--done); opacity: 0.55; }
  .flow-edge.edge-blocked { stroke: var(--blocked); opacity: 0.7; }

  .flow-edge.edge-active {
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-dasharray: 6 6;
    animation: flow-dash 0.7s linear infinite;
  }

  @keyframes flow-dash { to { stroke-dashoffset: -24; } }

  .flow-edge-spur {
    stroke: var(--hairline);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 3 4;
  }
  .flow-edge-spur.edge-active {
    stroke: var(--accent);
    animation: flow-dash 0.7s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .flow-edge.edge-active, .flow-edge-spur.edge-active { animation: none; stroke-dasharray: none; }
  }

  /* ---------- ledger ---------- */
  .ledger {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--ink-2);
    overflow: hidden;
  }

  .ledger-head {
    padding: 10px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 1px solid var(--hairline);
  }

  .stage-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 4px 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--hairline);
    align-items: start;
  }
  .stage-row:last-child { border-bottom: none; }

  .stage-code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
    padding-top: 1px;
  }

  .stage-body { min-width: 0; }

  .stage-name {
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .model-badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--text-faint);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 1px 5px;
    letter-spacing: 0.03em;
  }

  .stage-summary { margin: 3px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--text-dim); }

  .pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    white-space: nowrap;
    justify-self: end;
    margin-top: 1px;
  }
  .pill-pending { color: var(--text-dim); background: var(--pending-soft); }
  .pill-running { color: var(--accent); background: var(--accent-soft); }
  .pill-done { color: var(--done); background: var(--done-soft); }
  .pill-blocked { color: var(--blocked); background: var(--blocked-soft); }
  .pill-skipped { color: var(--text-faint); background: transparent; }

  .ledger-foot { padding: 11px 14px; background: rgba(217, 138, 61, 0.05); }
  .ledger-foot .stage-code { color: var(--accent); }

  footer {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    letter-spacing: 0.03em;
  }
</style>

<div class="wrap">
  <header>
    <div class="title-block">
      <span class="eyebrow">dev-team plugin · live tracker</span>
      <h1 id="page-title">Pipeline Control Room</h1>
    </div>
    <div class="header-actions">
      <div class="view-toggle" id="view-toggle">
        <button type="button" data-mode="flow" class="active">Flow</button>
        <button type="button" data-mode="ledger">Ledger</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <div class="session-panel">
      <div class="session-panel-head">
        <span>Active sessions</span>
        <span class="session-count" id="session-count">0</span>
      </div>
      <div class="session-list" id="session-list"></div>
    </div>

    <div class="main-pane" id="main-pane">
      <div class="empty-state" id="empty-state">No dev-team runs yet. Once /dev-team starts a run with this visualization configured, it shows up here.</div>

      <div id="selected-view" hidden>
        <div class="info-box" id="info-box"></div>

        <div id="flow-view">
          <div class="flow-panel">
            <svg class="flow-svg" id="flow-svg" viewBox="0 0 750 1100" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
        </div>

        <div id="ledger-view" hidden>
          <div class="ledger" id="ledger"></div>
        </div>
      </div>
    </div>
  </div>

  <footer id="status-line">connecting to live run data…</footer>
</div>

<script>
(function () {
  "use strict";

  // ---------- pipeline definition ----------
  var MAIN_LINE = [
    { key: "plan",     code: "01",  name: "Plan",           flowLabel: "Plan",     agent: "project-manager",   model: "opus" },
    { key: "approval", code: "02",  name: "Approval",       flowLabel: "Approval", agent: "you",               model: null },
    { key: "design",   code: "03",  name: "Design",         flowLabel: "Design",   agent: "designer",          model: "sonnet" },
    { key: "tests",    code: "04",  name: "Tests · RED",    flowLabel: "Tests",    agent: "test-engineer",     model: "sonnet" },
    { key: "database", code: "05",  name: "Database",       flowLabel: "Database", agent: "database-engineer", model: "sonnet" },
    { key: "frontend", code: "06a", name: "Build · FE",     flowLabel: "Frontend", agent: "frontend-engineer", model: "sonnet" },
    { key: "backend",  code: "06b", name: "Build · BE",     flowLabel: "Backend",  agent: "backend-engineer",  model: "sonnet" },
    { key: "devops",   code: "06c", name: "Build · Ops",    flowLabel: "DevOps",   agent: "devops-engineer",   model: "sonnet" },
    { key: "verify",   code: "07",  name: "Verify · GREEN", flowLabel: "Verify",   agent: "tester",            model: "sonnet" },
    { key: "review",   code: "08",  name: "Review",         flowLabel: "Review",   agent: "reviewer",          model: "sonnet" }
  ];
  var SPUR = { key: "researcher", name: "Research", flowLabel: "Research", agent: "researcher", model: "haiku" };

  var STATUS_LABEL = { pending: "pending", running: "running", done: "done", blocked: "blocked", skipped: "skipped" };
  var STATUS_RANK = { blocked: 0, running: 1, pending: 2, done: 3, skipped: 3 };

  function projectDotStatus(run) {
    var stages = (run && run.stages) || {};
    var best = "done";
    Object.keys(stages).forEach(function (k) {
      var s = stages[k].status || "pending";
      if (STATUS_RANK[s] < STATUS_RANK[best]) best = s;
    });
    return best;
  }

  // ---------- example seed ----------
  var EXAMPLE_PROJECTS = {
    "dev-team-test": {
      projectName: "dev-team-test",
      feature: "slugify(str) helper — lowercase, hyphenate, strip invalid chars",
      runId: "demo-slugify",
      startedAt: "2026-09-12T09:14:00Z",
      updatedAt: "2026-09-12T09:21:40Z",
      current: "done",
      stages: {
        plan:     { status: "done", summary: "Scoped to a pure function in slugify.js. No frontend touch; backend-only." },
        approval: { status: "done", summary: "Plan accepted by user without changes." },
        design:   { status: "skipped", summary: "Not required — no UI surface in this feature." },
        tests:    { status: "done", summary: "4 jest cases written against acceptance criteria; confirmed red before implementation." },
        database: { status: "skipped", summary: "No persistent data involved — pure function only." },
        frontend: { status: "skipped", summary: "Not required for this feature." },
        backend:  { status: "done", summary: "slugify.js implemented; all 4 new tests pass locally." },
        devops:   { status: "skipped", summary: "No CI/deploy changes needed." },
        verify:   { status: "done", summary: "Full suite green, no regressions, all acceptance criteria covered." },
        review:   { status: "done", summary: "Clean — no findings. Matches existing module conventions." },
        researcher: { status: "done", summary: "Checked for an existing slug helper before planning — none found.", calls: 1 }
      }
    },
    "checkout-flow": {
      projectName: "checkout-flow",
      feature: "Add saved-card autopay toggle to checkout, with backend charge scheduling",
      runId: "a1b2c3",
      startedAt: "2026-09-12T18:40:00Z",
      updatedAt: "2026-09-12T19:32:00Z",
      current: "verify",
      stages: {
        plan: { status: "done", summary: "Scoped: FE toggle + BE scheduling job, no schema change needed." },
        approval: { status: "done", summary: "Approved without changes." },
        design: { status: "done", summary: "Toggle + confirmation modal designed." },
        tests: { status: "done", summary: "9 cases written across FE/BE, confirmed red." },
        database: { status: "skipped", summary: "Reused existing payment_methods table." },
        frontend: { status: "done", summary: "Toggle + modal implemented." },
        backend: { status: "done", summary: "Scheduling job implemented." },
        devops: { status: "skipped", summary: "No infra changes." },
        verify: { status: "running", summary: "Running full suite against new scheduling job." },
        review: { status: "pending", summary: "" },
        researcher: { status: "done", summary: "Checked existing job-scheduling patterns.", calls: 2 }
      }
    }
  };

  // ---------- helpers ----------
  function escapeHtml(str) {
    var d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return "—"; }
  }

  function relTime(iso) {
    if (!iso) return "";
    var ms = Date.now() - new Date(iso).getTime();
    var min = Math.round(ms / 60000);
    if (min < 1) return "now";
    if (min < 60) return min + "m ago";
    var hr = Math.round(min / 60);
    if (hr < 24) return hr + "h ago";
    return Math.round(hr / 24) + "d ago";
  }

  function currentStageName(run) {
    var def = MAIN_LINE.filter(function (s) { return s.key === run.current; })[0];
    return def ? def.name : (run.current === "researcher" ? "Research" : "Idle");
  }

  // ---------- ledger rendering ----------
  function stageRow(code, name, agent, model, s) {
    var status = s.status || "pending";
    var pillClass = "pill-" + (STATUS_LABEL[status] ? status : "pending");
    return (
      '<div class="stage-row">' +
        '<div class="stage-code">' + code + '</div>' +
        '<div class="stage-body">' +
          '<div class="stage-name">' + name +
            (model ? '<span class="model-badge">' + model + '</span>' : '') +
            '<span class="model-badge">' + agent + '</span>' +
          '</div>' +
          (s.summary ? '<p class="stage-summary">' + escapeHtml(s.summary) + '</p>' : '') +
        '</div>' +
        '<div class="pill ' + pillClass + '">' + (STATUS_LABEL[status] || status) + '</div>' +
      '</div>'
    );
  }

  function renderLedger(run) {
    var html = "";
    MAIN_LINE.forEach(function (def) {
      var s = (run.stages && run.stages[def.key]) || { status: "pending", summary: "" };
      html += stageRow(def.code, def.name, def.agent, def.model, s);
    });
    var r = (run.stages && run.stages.researcher) || { status: "pending", summary: "" };
    html += '<div class="ledger-foot">' + stageRow("↳", SPUR.name + " (on demand)", SPUR.agent, SPUR.model, r) + '</div>';
    document.getElementById("ledger").innerHTML = '<div class="ledger-head">stage ledger</div>' + html;
  }

  // ---------- flow diagram (SVG) ----------
  // Layout: main line left-to-right; frontend/backend/devops fork into a
  // vertical fan between database and verify; researcher is a dashed spur
  // dropping down from plan.
  // Vertical layout: main line runs top-to-bottom; frontend/backend/devops
  // fork into a horizontal row of three columns; researcher branches off
  // to the side of the plan row.
  var NODE_W = 210, NODE_H = 88;
  var ROW_GAP = 50;
  var ROW_H = NODE_H + ROW_GAP;
  var COL0 = 20, COL1 = 270, COL2 = 520; // fork columns (left/center/right)
  var MAIN_X = COL1; // single-column stages sit centered above the fork

  var MAIN_Y = {
    plan: 20,
    approval: 20 + ROW_H,
    design: 20 + ROW_H * 2,
    tests: 20 + ROW_H * 3,
    database: 20 + ROW_H * 4,
    fork: 20 + ROW_H * 5,
    verify: 20 + ROW_H * 6,
    review: 20 + ROW_H * 7
  };
  var RESEARCH_POS = { x: COL2, y: MAIN_Y.plan };

  var NODE_POS = {
    plan: { x: MAIN_X, y: MAIN_Y.plan },
    approval: { x: MAIN_X, y: MAIN_Y.approval },
    design: { x: MAIN_X, y: MAIN_Y.design },
    tests: { x: MAIN_X, y: MAIN_Y.tests },
    database: { x: MAIN_X, y: MAIN_Y.database },
    frontend: { x: COL0, y: MAIN_Y.fork },
    backend: { x: COL1, y: MAIN_Y.fork },
    devops: { x: COL2, y: MAIN_Y.fork },
    verify: { x: MAIN_X, y: MAIN_Y.verify },
    review: { x: MAIN_X, y: MAIN_Y.review },
    researcher: { x: RESEARCH_POS.x, y: RESEARCH_POS.y }
  };

  var EDGES = [
    ["plan", "approval"], ["approval", "design"], ["design", "tests"], ["tests", "database"],
    ["database", "frontend"], ["database", "backend"], ["database", "devops"],
    ["frontend", "verify"], ["backend", "verify"], ["devops", "verify"],
    ["verify", "review"]
  ];
  var SPUR_EDGE = ["plan", "researcher"];

  function nodeCenter(key) {
    var p = NODE_POS[key];
    return { x: p.x + NODE_W / 2, y: p.y + NODE_H / 2 };
  }

  function edgePath(fromKey, toKey) {
    var a = nodeCenter(fromKey), b = nodeCenter(toKey);
    if (a.x === b.x) {
      return "M " + a.x + " " + a.y + " L " + b.x + " " + b.y;
    }
    var midY = (a.y + b.y) / 2;
    return "M " + a.x + " " + a.y + " C " + a.x + " " + midY + ", " + b.x + " " + midY + ", " + b.x + " " + b.y;
  }

  function svgNode(def, s) {
    var status = (s && s.status) || "pending";
    var p = NODE_POS[def.key];
    var strokeColor = "var(--hairline)";
    var fillOpacity = status === "pending" ? 0.5 : 1;
    var textColor = "var(--text)";
    var boxClass = "flow-node status-" + status;
    var borderColor =
      status === "running" ? "var(--accent)" :
      status === "done" ? "var(--done)" :
      status === "blocked" ? "var(--blocked)" :
      status === "skipped" ? "var(--text-faint)" : "var(--hairline)";
    var dotColor =
      status === "running" ? "var(--accent)" :
      status === "done" ? "var(--done)" :
      status === "blocked" ? "var(--blocked)" :
      status === "skipped" ? "var(--text-faint)" : "var(--pending)";

    return (
      '<g class="' + boxClass + '" transform="translate(' + p.x + ',' + p.y + ')">' +
        '<rect width="' + NODE_W + '" height="' + NODE_H + '" rx="12" style="stroke:' + borderColor + ';fill-opacity:' + fillOpacity + '"></rect>' +
        '<circle class="flow-status-dot" cx="18" cy="20" r="6" fill="' + dotColor + '"></circle>' +
        '<text class="flow-code" x="18" y="76">' + def.code + '</text>' +
        '<text class="flow-label" x="34" y="30">' + escapeHtml(def.flowLabel || def.name) + '</text>' +
        '<text class="flow-agent" x="18" y="54">' + escapeHtml(def.agent) + '</text>' +
      '</g>'
    );
  }

  function edgeStatusClass(fromKey, toKey, stages, currentKey) {
    var toStage = (stages[toKey] || {}).status || "pending";
    if (toKey === currentKey && toStage === "running") return "edge-active";
    if (toStage === "blocked") return "edge-blocked";
    if (toStage === "done" || toStage === "skipped") return "edge-done";
    return "";
  }

  function renderFlow(run) {
    var stages = run.stages || {};
    var currentKey = run.current;
    var svg = document.getElementById("flow-svg");
    var parts = [];

    EDGES.forEach(function (e) {
      var cls = edgeStatusClass(e[0], e[1], stages, currentKey);
      parts.push('<path class="flow-edge ' + cls + '" d="' + edgePath(e[0], e[1]) + '"></path>');
    });

    var spurCls = edgeStatusClass(SPUR_EDGE[0], SPUR_EDGE[1], stages, currentKey);
    parts.push('<path class="flow-edge-spur ' + spurCls + '" d="' + edgePath(SPUR_EDGE[0], SPUR_EDGE[1]) + '"></path>');

    MAIN_LINE.forEach(function (def) {
      parts.push(svgNode(def, stages[def.key]));
    });
    parts.push(svgNode(SPUR, stages.researcher));

    svg.innerHTML = parts.join("");
  }

  // ---------- info box ----------
  function renderInfoBox(run) {
    var stage = currentStageName(run);
    var html =
      '<div class="info-top">' +
        '<span class="info-name">' + escapeHtml(run.projectName || "") + '</span>' +
        '<p class="info-feature">' + escapeHtml(run.feature || "") + '</p>' +
      '</div>' +
      '<div class="info-meta">' +
        '<span>RUN <b>' + escapeHtml(run.runId || "—") + '</b></span>' +
        '<span>STARTED <b>' + fmtTime(run.startedAt) + '</b></span>' +
        '<span>UPDATED <b>' + fmtTime(run.updatedAt) + '</b></span>' +
        '<span class="stage-now">STAGE <b>' + escapeHtml(stage) + '</b></span>' +
      '</div>';
    document.getElementById("info-box").innerHTML = html;
  }

  function progressBarHtml(run) {
    var stages = run.stages || {};
    return '<div class="session-progress">' + MAIN_LINE.map(function (def) {
      var status = (stages[def.key] || {}).status || "pending";
      return '<span class="dot-' + status + '"></span>';
    }).join("") + '</div>';
  }

  // ---------- state ----------
  var projects = {};
  var selectedId = null;
  var mode = "flow"; // "flow" | "ledger"

  function storedMode() {
    try { return localStorage.getItem("dev-team-viz-mode"); } catch (e) { return null; }
  }
  function storeMode(m) {
    try { localStorage.setItem("dev-team-viz-mode", m); } catch (e) { /* ignore */ }
  }

  var viewToggleEl = document.getElementById("view-toggle");
  viewToggleEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    mode = btn.getAttribute("data-mode");
    storeMode(mode);
    applyMode();
  });

  function applyMode() {
    Array.prototype.forEach.call(viewToggleEl.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-mode") === mode);
    });
    document.getElementById("flow-view").hidden = mode !== "flow";
    document.getElementById("ledger-view").hidden = mode !== "ledger";
  }

  function renderSessionList() {
    var ids = Object.keys(projects).sort(function (a, b) {
      var rankDiff = STATUS_RANK[projectDotStatus(projects[a])] - STATUS_RANK[projectDotStatus(projects[b])];
      if (rankDiff !== 0) return rankDiff;
      return new Date(projects[b].updatedAt || 0) - new Date(projects[a].updatedAt || 0);
    });

    document.getElementById("session-count").textContent = ids.length;
    var listEl = document.getElementById("session-list");

    if (!ids.length) {
      listEl.innerHTML = '<div class="session-empty">No active runs</div>';
      return;
    }

    listEl.innerHTML = ids.map(function (id) {
      var run = projects[id];
      var dot = projectDotStatus(run);
      var active = id === selectedId ? " active" : "";
      return (
        '<button class="session-row' + active + '" type="button" data-id="' + escapeHtml(id) + '">' +
          '<div class="session-top">' +
            '<span class="dot dot-' + dot + '"></span>' +
            '<span class="session-name">' + escapeHtml(run.projectName || id) + '</span>' +
          '</div>' +
          '<div class="session-meta"><span>' + escapeHtml(currentStageName(run)) + '</span><b>' + relTime(run.updatedAt) + '</b></div>' +
          progressBarHtml(run) +
        '</button>'
      );
    }).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll(".session-row"), function (row) {
      row.addEventListener("click", function () { selectProject(row.getAttribute("data-id")); });
    });
  }

  function selectProject(id) {
    if (!projects[id]) return;
    selectedId = id;
    renderSessionList();
    renderSelected();
  }

  function renderSelected() {
    var emptyEl = document.getElementById("empty-state");
    var selectedEl = document.getElementById("selected-view");

    if (!selectedId || !projects[selectedId]) {
      var ids = Object.keys(projects);
      if (ids.length) {
        ids.sort(function (a, b) { return new Date(projects[b].updatedAt || 0) - new Date(projects[a].updatedAt || 0); });
        selectedId = ids[0];
      }
    }

    if (!selectedId || !projects[selectedId]) {
      emptyEl.hidden = false;
      selectedEl.hidden = true;
      document.getElementById("page-title").textContent = "Pipeline Control Room";
      return;
    }

    emptyEl.hidden = true;
    selectedEl.hidden = false;
    var run = projects[selectedId];
    document.getElementById("page-title").textContent = run.projectName || selectedId;
    renderInfoBox(run);
    renderFlow(run);
    renderLedger(run);
  }

  function rerender() {
    renderSessionList();
    renderSelected();
  }

  // ---------- theme toggle ----------
  var themeToggleEl = document.getElementById("theme-toggle");
  var themeIconEl = document.getElementById("theme-icon");
  var SUN_PATH = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
  var MOON_PATH = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path>';

  function storedTheme() {
    try { return localStorage.getItem("dev-team-viz-theme"); } catch (e) { return null; }
  }
  function storeTheme(m) {
    try { localStorage.setItem("dev-team-viz-theme", m); } catch (e) { /* ignore */ }
  }
  function systemTheme() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function setTheme(m) {
    document.documentElement.setAttribute("data-theme", m);
    themeIconEl.innerHTML = m === "dark" ? SUN_PATH : MOON_PATH;
  }
  themeToggleEl.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    storeTheme(next);
    setTheme(next);
  });
  setTheme(storedTheme() || systemTheme());
  mode = storedMode() === "ledger" ? "ledger" : "flow";
  applyMode();

  // ---------- boot ----------
  var statusLine = document.getElementById("status-line");
  projects = EXAMPLE_PROJECTS;
  rerender();

  (async function () {
    try {
      var db = window.claude && (await window.claude.use("db"));
      if (!db) {
        statusLine.textContent = "showing last known runs · example data (live db unavailable in this view)";
        return;
      }
      db.collection("runs").onSnapshot(
        function (snap) {
          var live = {};
          snap.docs.forEach(function (doc) { live[doc.id] = doc.data(); });
          if (snap.size > 0) projects = live;
          statusLine.textContent = "live · tracking " + snap.size + " project" + (snap.size === 1 ? "" : "s");
          rerender();
        },
        function (err) {
          statusLine.textContent = "live updates unavailable (" + err.code + ") · showing last known runs";
        }
      );
    } catch (e) {
      statusLine.textContent = "showing last known runs · example data (live db unavailable in this view)";
    }
  })();
})();
</script>
